<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=0.5">
    <title>News - CritPt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <style>
        body {
            font-family: 'Aptos', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Pill({ children, href, active = false }) {
            return (
                <a
                    href={href}
                    aria-current={active ? 'page' : undefined}
                    className={`px-4 py-2 rounded-full font-medium text-lg transition-transform duration-200 hover:font-semibold hover:scale-110 ${active ? 'font-semibold scale-110' : ''}`}
                    style={{color: 'rgb(240, 237, 228)'}}
                >
                    {children}
                </a>
            );
        }

        function BrandMark() {
            return (
                <a href="index.html" className="flex items-center gap-2 no-underline">
                    <img src="figures/CritPt_Cavolini.png" alt="CritPt" style={{height: '80px', marginLeft: '-16px', marginTop: '16px'}} />
                </a>
            );
        }

        function App() {
            const [menuOpen, setMenuOpen] = useState(false);
            const mobileLinkClass = "text-left w-full px-3 py-2 rounded-lg font-medium text-base text-[rgb(240,237,228)] hover:bg-white/10";

            return (
                <div className="min-h-screen" style={{backgroundColor: 'rgb(240, 237, 228)', color: 'rgb(89, 89, 89)'}}>
                    <header className="sticky top-0 z-40 w-full border-b border-black/5 backdrop-blur" style={{backgroundColor: 'rgb(15, 76, 129)'}}>
                        <div className="relative mx-auto max-w-6xl px-4">
                            <div className="flex h-20 items-center justify-between gap-4">
                                <BrandMark />
                                <div className="flex items-center gap-2">
                                    <button
                                        className="lg:hidden inline-flex items-center gap-2 rounded-full border border-white/30 px-3 py-1 text-sm font-semibold text-[rgb(240,237,228)] shadow-sm active:scale-[0.98]"
                                        onClick={() => setMenuOpen((v) => !v)}
                                        aria-expanded={menuOpen ? 'true' : 'false'}
                                        aria-label="Toggle navigation menu"
                                    >
                                        <span className="text-base">☰</span>
                                        <span>Menu</span>
                                    </button>
                                    <nav className="hidden lg:flex items-center gap-2">
                                        <Pill href="index.html">Overview</Pill>
                                        <Pill href="news.html" active>News</Pill>
                                        <Pill href="benchmark-coverage.html">Coverage</Pill>
                                        <Pill href="example.html">Example</Pill>
                                        <Pill href="about.html">About</Pill>
                                    </nav>
                                </div>
                            </div>
                            {menuOpen && (
                                <div className="absolute left-0 right-0 top-20 lg:hidden border-t border-white/10" style={{backgroundColor: 'rgba(15, 76, 129, 0.95)'}}>
                                    <div className="flex flex-col gap-1 px-4 py-3">
                                        <a className={mobileLinkClass} href="index.html" onClick={() => setMenuOpen(false)}>Overview</a>
                                        <a className={mobileLinkClass} href="news.html" aria-current="page" onClick={() => setMenuOpen(false)}>News</a>
                                        <a className={mobileLinkClass} href="benchmark-coverage.html" onClick={() => setMenuOpen(false)}>Coverage</a>
                                        <a className={mobileLinkClass} href="example.html" onClick={() => setMenuOpen(false)}>Example</a>
                                        <a className={mobileLinkClass} href="about.html" onClick={() => setMenuOpen(false)}>About</a>
                                    </div>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="mx-auto max-w-6xl px-4 py-16">
                        <h1 className="text-3xl md:text-[2.8rem] font-semibold mb-8">News</h1>
                        <section aria-label="News announcements" className="space-y-6 text-xl leading-snug">
                            <p>
                                <strong><time dateTime="2026-09-26">September 26, 2026</time>:</strong>{' '}
                                We are actively maintaining the benchmark and incorporating community feedback. All benchmark problems are currently under expert review.
                            </p>
                            <p>
                                <strong><time dateTime="2025-11-21">November 21, 2025</time>:</strong>{' '}
                                <span className="italic">CritPt</span> made its official debut on{' '}
                                <a href="https://artificialanalysis.ai/evaluations/critpt" target="_blank" rel="noreferrer" className="text-inherit underline hover:no-underline">Artificial Analysis</a>!
                            </p>
                            <p>
                                <strong><time dateTime="2025-11-21">November 21, 2025</time>:</strong>{' '}
                                The evaluation pipeline and challenge dataset are now publicly available!
                                {' '}To evaluate your own models on <span className="italic">CritPt</span>, please follow the instructions provided on{' '}
                                <a href="https://critpt.com/example.html" className="text-inherit underline hover:no-underline">this page</a>.
                                {' '}An example challenge can be found <a href="example.html" className="text-inherit underline hover:no-underline">here</a>.
                                {' '}See 70 test challenges in{' '}
                                <a href="https://github.com/CritPt-Benchmark/CritPt/tree/main/data" target="_blank" rel="noreferrer" className="text-inherit underline hover:no-underline">this folder</a> or on{' '}
                                <a href="https://huggingface.co/datasets/CritPt-Benchmark/CritPt" target="_blank" rel="noreferrer" className="text-inherit underline hover:no-underline">Hugging Face</a>.
                            </p>
                        </section>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
